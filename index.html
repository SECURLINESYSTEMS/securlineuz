<script>

/* =====================================================
   ФОРМА ЗАЯВКИ
===================================================== */

const GOOGLE_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyj4FruRd3JzYOutyoV88OLIPFwW4oaOiZyvWauOoaRSYeMsRN9q9RGmWC3GyxFlFC2/exec";

const form =
document.getElementById("requestForm");

const submitButton =
document.getElementById("submitButton");


if (form) {

form.addEventListener("submit", async function(event) {

event.preventDefault();


const name =
form.querySelector('[name="name"]').value.trim();

const phone =
form.querySelector('[name="phone"]').value.trim();

const message =
form.querySelector('[name="message"]').value.trim();


if (!name || !phone || !message) {

alert("Пожалуйста, заполните все поля.");

return;

}


submitButton.disabled = true;

submitButton.textContent =
"Отправляем...";


try {

await fetch(
GOOGLE_SCRIPT_URL,
{
method: "POST",
mode: "no-cors",
headers: {
"Content-Type":
"text/plain;charset=utf-8"
},
body: JSON.stringify({
name: name,
phone: phone,
message: message
})
}
);


alert(
"✅ Заявка отправлена! Мы скоро свяжемся с вами."
);


form.reset();


} catch (error) {

console.error(error);

alert(
"❌ Не удалось отправить заявку. Попробуйте ещё раз."
);

} finally {

submitButton.disabled = false;

submitButton.textContent =
"Отправить заявку";

}

});

}


/* =====================================================
   СЛАЙДЕР ФОТОГРАФИЙ
===================================================== */

const track =
document.getElementById("worksTrack");

const slides =
document.querySelectorAll(".work-slide");

const dotsContainer =
document.getElementById("sliderDots");

let currentSlide = 0;

let autoSlide;


/* Создаём точки */

if (track && slides.length && dotsContainer) {

slides.forEach(function(_, index) {

const dot =
document.createElement("button");

dot.className =
"slider-dot";

dot.addEventListener(
"click",
function() {

goToSlide(index);

startAutoSlide();

}
);

dotsContainer.appendChild(dot);

});


const dots =
document.querySelectorAll(".slider-dot");


function updateSlider() {

track.style.transform =
"translateX(-" +
(currentSlide * 100) +
"%)";


dots.forEach(
function(dot, index) {

dot.classList.toggle(
"active",
index === currentSlide
);

}
);

}


function goToSlide(index) {

currentSlide =
(index + slides.length) %
slides.length;

updateSlider();

}


function nextSlide() {

goToSlide(currentSlide + 1);

}


function previousSlide() {

goToSlide(currentSlide - 1);

}


/* Делаем функции доступными кнопкам */

window.nextSlide =
nextSlide;

window.previousSlide =
previousSlide;

window.goToSlide =
goToSlide;


/* Автоматическая смена */

function startAutoSlide() {

clearInterval(autoSlide);

autoSlide =
setInterval(
nextSlide,
4500
);

}


updateSlider();

startAutoSlide();


/* Пауза при наведении */

const slider =
document.querySelector(".works-slider");


if (slider) {

slider.addEventListener(
"mouseenter",
function() {

clearInterval(autoSlide);

}
);


slider.addEventListener(
"mouseleave",
function() {

startAutoSlide();

}
);


/* =====================================================
   СВАЙП НА ТЕЛЕФОНЕ
===================================================== */

let touchStartX = 0;


slider.addEventListener(
"touchstart",
function(event) {

touchStartX =
event.changedTouches[0].screenX;

clearInterval(autoSlide);

},
{passive:true}
);


slider.addEventListener(
"touchend",
function(event) {

const touchEndX =
event.changedTouches[0].screenX;

const difference =
touchStartX - touchEndX;


if (Math.abs(difference) > 50) {

if (difference > 0) {

nextSlide();

} else {

previousSlide();

}

}


startAutoSlide();

},
{passive:true}
);

}

}


/* =====================================================
   ОТКРЫТИЕ ФОТОГРАФИИ
===================================================== */

function openImage(src) {

const modal =
document.getElementById("imageModal");

const modalImage =
document.getElementById("modalImage");


if (!modal || !modalImage) {
return;
}


modalImage.src = src;

modal.classList.add("active");

document.body.style.overflow =
"hidden";

}


window.openImage =
openImage;


/* =====================================================
   ЗАКРЫТИЕ ФОТОГРАФИИ
===================================================== */

function closeImage(event) {

if (event) {

event.stopPropagation();

}


const modal =
document.getElementById("imageModal");


if (!modal) {
return;
}


modal.classList.remove("active");

document.body.style.overflow =
"";


const modalImage =
document.getElementById("modalImage");


if (modalImage) {

modalImage.src = "";

}

}


window.closeImage =
closeImage;


/* =====================================================
   ESC — ЗАКРЫТЬ ФОТО
===================================================== */

document.addEventListener(
"keydown",
function(event) {

if (event.key === "Escape") {

closeImage();

}

}
);

</script>
