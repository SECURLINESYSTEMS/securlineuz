<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecurLineUz — Системы безопасности</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

/* ===== HEADER ===== */

header {
    background: linear-gradient(135deg, #111827, #1e293b);
    color: white;
    padding: 18px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 15px rgba(0,0,0,0.15);
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo-icon {
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: #dc2626;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

.logo h1 {
    font-size: 20px;
}

.logo p {
    color: #cbd5e1;
    font-size: 12px;
}

.telegram-top {
    background: #229ed9;
    color: white;
    text-decoration: none;
    padding: 10px 15px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
}

/* ===== HERO ===== */

.hero {
    background:
        radial-gradient(circle at top right, rgba(220,38,38,0.25), transparent 35%),
        linear-gradient(135deg, #0f172a, #111827);
    color: white;
    padding: 75px 20px 80px;
    text-align: center;
}

.hero-content {
    max-width: 800px;
    margin: auto;
}

.badge {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 8px 14px;
    border-radius: 30px;
    font-size: 14px;
    margin-bottom: 20px;
}

.hero h2 {
    font-size: clamp(34px, 7vw, 58px);
    line-height: 1.05;
    margin-bottom: 20px;
}

.hero h2 span {
    color: #ef4444;
}

.hero p {
    max-width: 650px;
    margin: auto;
    color: #cbd5e1;
    line-height: 1.7;
    font-size: 17px;
}

.hero-buttons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

.button {
    display: inline-block;
    padding: 14px 22px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 700;
    transition: 0.2s;
}

.button-red {
    background: #dc2626;
    color: white;
}

.button-blue {
    background: #229ed9;
    color: white;
}

.button:hover {
    transform: translateY(-2px);
}

/* ===== SECTIONS ===== */

.section {
    max-width: 1100px;
    margin: auto;
    padding: 60px 20px;
}

.section-title {
    text-align: center;
    margin-bottom: 35px;
}

.section-title h2 {
    font-size: 32px;
    margin-bottom: 10px;
}

.section-title p {
    color: #64748b;
}

/* ===== SERVICES ===== */

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 5px 25px rgba(15,23,42,0.07);
    border: 1px solid #e5e7eb;
    transition: 0.25s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 30px rgba(15,23,42,0.12);
}

.card-icon {
    font-size: 32px;
    margin-bottom: 18px;
}

.card h3 {
    margin-bottom: 10px;
    font-size: 19px;
}

.card p {
    color: #64748b;
    line-height: 1.6;
}

/* ===== OBJECTS ===== */

.objects {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.object {
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 5px 25px rgba(15,23,42,0.08);
    border: 1px solid #e5e7eb;
    transition: 0.25s;
}

.object:hover {
    transform: translateY(-5px);
}

.object-photo {
    height: 230px;
    background:
        linear-gradient(135deg, #1e293b, #334155);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 55px;
}

.object-text {
    padding: 20px;
}

.object-text h3 {
    margin-bottom: 8px;
}

.object-text p {
    color: #64748b;
    line-height: 1.5;
}

.object-tag {
    display: inline-block;
    margin-top: 14px;
    padding: 6px 10px;
    border-radius: 20px;
    background: #fee2e2;
    color: #b91c1c;
    font-size: 12px;
    font-weight: 700;
}

/* ===== CTA ===== */

.cta {
    max-width: 1100px;
    margin: 20px auto 60px;
    padding: 45px 25px;
    border-radius: 25px;
    background: linear-gradient(135deg, #dc2626, #991b1b);
    color: white;
    text-align: center;
}

.cta h2 {
    font-size: 30px;
    margin-bottom: 12px;
}

.cta p {
    color: #fee2e2;
    margin-bottom: 25px;
}

.cta-button {
    display: inline-block;
    background: white;
    color: #b91c1c;
    padding: 14px 25px;
    border-radius: 14px;
    text-decoration: none;
    font-weight: 800;
}

/* ===== FORM ===== */

.form {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 5px 25px rgba(15,23,42,0.08);
}

.form input,
.form textarea {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.form input:focus,
.form textarea:focus {
    border-color: #229ed9;
}

.form textarea {
    min-height: 120px;
    resize: vertical;
}

    padding
