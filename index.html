<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SecurLineUz — Системы безопасности</title>

<meta name="description"
content="SecurLineUz — видеонаблюдение, пожарная сигнализация и охранные системы. Проектирование, монтаж и обслуживание систем безопасности.">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f5f7fc;
    color:#07152f;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}

button{
    font-family:inherit;
}

/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#020b22;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.header-inner{
    max-width:1200px;
    min-height:92px;
    margin:auto;
    padding:12px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo-icon{
    width:64px;
    height:64px;
    border-radius:17px;
    background:#ed111c;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    box-shadow:0 8px 25px rgba(237,17,28,.3);
}

.logo-text h1{
    color:white;
    font-size:29px;
    line-height:1;
    letter-spacing:.5px;
    font-weight:800;
}

.logo-text p{
    color:#d8deea;
    margin-top:7px;
    font-size:16px;
}

.header-buttons{
    display:flex;
    align-items:center;
    gap:14px;
}

.top-button{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:white;
    padding:14px 22px;
    border-radius:14px;
    font-size:17px;
    font-weight:700;
    transition:.25s;
}

.top-button:hover{
    transform:translateY(-2px);
}

.telegram-button{
    background:#168fd2;
}

.request-button{
    background:#ed111c;
}

.menu-button{
    width:50px;
    height:50px;
    border:0;
    background:transparent;
    color:white;
    font-size:32px;
    cursor:pointer;
}

/* =====================================================
   MOBILE MENU
===================================================== */

.mobile-menu{
    position:fixed;
    top:0;
    right:-100%;
    width:300px;
    max-width:85%;
    height:100vh;
    background:#06122e;
    z-index:3000;
    padding:30px 25px;
    transition:.3s;
    box-shadow:-10px 0 40px rgba(0,0,0,.35);
}

.mobile-menu.active{
    right:0;
}

.mobile-menu-close{
    color:white;
    font-size:38px;
    text-align:right;
    cursor:pointer;
    margin-bottom:35px;
}

.mobile-menu a{
    display:block;
    color:white;
    padding:16px 5px;
    border-bottom:1px solid rgba(255,255,255,.1);
    font-size:17px;
    font-weight:600;
}

.menu-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.6);
    z-index:2500;
    display:none;
}

.menu-overlay.active{
    display:block;
}

/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;
    min-height:690px;
    background:
        radial-gradient(circle at 75% 45%,rgba(227,17,29,.18),transparent 28%),
        radial-gradient(circle at 90% 20%,rgba(21,103,190,.18),transparent 30%),
        linear-gradient(135deg,#02091d,#071633 65%,#02091b);
    color:white;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    right:-220px;
    top:-200px;
    border-radius:50%;
    background:rgba(237,17,28,.08);
    filter:blur(10px);
}

.hero-container{
    max-width:1200px;
    min-height:690px;
    margin:auto;
    padding:65px 25px 70px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:35px;
}

.hero-content{
    position:relative;
    z-index:2;
}

.hero h2{
    font-size:clamp(48px,6vw,75px);
    line-height:1.02;
    font-weight:800;
    margin-bottom:22px;
}

.hero h2 span{
    color:#ed111c;
}

.hero-subtitle{
    color:#bac6dc;
    font-size:20px;
    line-height:1.5;
    max-width:600px;
    margin-bottom:27px;
}

.hero-list{
    list-style:none;
    margin-bottom:30px;
}

.hero-list li{
    display:flex;
    align-items:center;
    gap:13px;
    margin:13px 0;
    font-size:19px;
    font-weight:600;
}

.hero-list-icon{
    width:45px;
    height:45px;
    border:2px solid #ed111c;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.hero-cta{
    display:inline-flex;
    align-items:center;
    gap:14px;
    background:#ed111c;
    color:white;
    padding:17px 28px;
    border-radius:15px;
    font-size:18px;
    font-weight:800;
    box-shadow:0 12px 30px rgba(237,17,28,.28);
    transition:.25s;
}

.hero-cta:hover{
    transform:translateY(-3px);
}

/* =====================================================
   HERO SECURITY VISUAL
===================================================== */

.hero-visual{
    position:relative;
    min-height:530px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.wall{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:30px;
    background:
        linear-gradient(135deg,rgba(255,255,255,.04) 1px,transparent 1px),
        linear-gradient(45deg,rgba(255,255,255,.025) 1px,transparent 1px),
        #0b1934;
    background-size:45px 45px;
    border:1px solid rgba(255,255,255,.06);
}

.camera{
    position:absolute;
    right:18%;
    top:65px;
    width:230px;
    height:135px;
    border-radius:75px 35px 35px 75px;
    background:linear-gradient(145deg,#e5e9f0,#858d9d);
    transform:rotate(-4deg);
    box-shadow:0 20px 40px rgba(0,0,0,.45);
    z-index:2;
}

.camera::before{
    content:"";
    position:absolute;
    left:-22px;
    top:30px;
    width:75px;
    height:75px;
    border-radius:50%;
    background:#17243b;
    border:9px solid #aeb6c3;
}

.camera::after{
    content:"";
    position:absolute;
    right:-55px;
    top:34px;
    width:70px;
    height:70px;
    background:#c8ced7;
    clip-path:polygon(0 25%,100% 0,100% 100%,0 75%);
}

.camera-lens{
    position:absolute;
    left:3px;
    top:38px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:
        radial-gradient(circle,#020611 20%,#111c32 22%,#050a15 45%,#26354e 47%,#030710 60%);
    border:4px solid #38465c;
    z-index:3;
}

.fire-panel{
    position:absolute;
    right:12%;
    bottom:95px;
    width:300px;
    height:185px;
    border-radius:12px;
    background:#b8bec9;
    border:7px solid #747d8d;
    box-shadow:0 25px 45px rgba(0,0,0,.45);
    z-index:2;
    padding:20px;
}

.fire-panel-screen{
    height:75px;
    border-radius:7px;
    background:#07152a;
    border:6px solid #5d6676;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#53d68a;
    font-size:14px;
    letter-spacing:2px;
}

.fire-panel-title{
    color:#a51a1f;
    font-weight:900;
    font-size:21px;
    text-align:center;
    margin-top:10px;
}

.fire-alarm{
    position:absolute;
    right:-25px;
    bottom:45px;
    width:110px;
    height:110px;
    border-radius:12px;
    background:#d71920;
    border:6px solid #941017;
    color:white;
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-weight:900;
    box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.fire-alarm span{
    font-size:30px;
    margin-bottom:5px;
}

.smoke{
    position:absolute;
    left:15%;
    bottom:60px;
    width:95px;
    height:95px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#e5e8ee,#9aa2ae);
    box-shadow:0 18px 30px rgba(0,0,0,.4);
    z-index:3;
}

/* =====================================================
   SECTION TITLES
===================================================== */

.section{
    max-width:1200px;
    margin:auto;
    padding:80px 25px;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title::before{
    content:"🛡️";
    display:block;
    font-size:42px;
    margin-bottom:10px;
}

.section-title h2{
    font-size:42px;
    line-height:1.1;
    margin-bottom:12px;
    font-weight:800;
}

.section-title p{
    color:#52627a;
    font-size:18px;
}

/* =====================================================
   SERVICES
===================================================== */

.services{
    background:#f7f9fd;
}

.services-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.service-card{
    background:white;
    min-height:275px;
    padding:35px 25px;
    border-radius:28px;
    text-align:center;
    border:1px solid #e4e9f2;
    box-shadow:0 12px 35px rgba(20,44,80,.08);
    transition:.3s;
}

.service-card:hover{
    transform:translateY(-8px);
    box-shadow:0 20px 45px rgba(20,44,80,.13);
}

.service-icon{
    font-size:70px;
    height:90px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.service-card h3{
    font-size:24px;
    margin:15px 0 15px;
}

.red-line{
    width:48px;
    height:5px;
    border-radius:10px;
    background:#ed111c;
    margin:0 auto 17px;
}

.service-card p{
    color:#394a63;
    font-size:17px;
    line-height:1.35;
}

/* =====================================================
   WHY US
===================================================== */

.why-section{
    background:#f7f9fd;
}

.why-box{
    background:linear-gradient(135deg,#061431,#0b1b3d);
    border-radius:32px;
    padding:55px 35px;
    color:white;
    box-shadow:0 20px 55px rgba(4,17,42,.18);
}

.why-title{
    text-align:center;
    margin-bottom:45px;
}

.why-title h2{
    font-size:40px;
}

.why-title .red-line{
    margin-top:15px;
}

.why-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.why-card{
    text-align:center;
}

.why-icon{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border:3px solid #ed111c;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
}

.why-card h3{
    font-size:19px;
    line-height:1.25;
}

/* =====================================================
   WORKS
===================================================== */

.works-section{
    background:white;
}

.works-slider{
    position:relative;
    max-width:1050px;
    margin:auto;
    overflow:hidden;
    border-radius:28px;
    background:#061431;
    box-shadow:0 20px 50px rgba(5,22,53,.18);
}

.works-track{
    display:flex;
    transition:transform .55s ease;
}

.work-slide{
    min-width:100%;
    position:relative;
}

.work-slide img{
    width:100%;
    height:570px;
    display:block;
    object-fit:cover;
    cursor:pointer;
}

.work-info{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:75px 35px 30px;
    background:linear-gradient(transparent,rgba(0,0,0,.9));
    color:white;
}

.work-info h3{
    font-size:28px;
    margin-bottom:7px;
}

.work-info p{
    color:#dce4f1;
    font-size:16px;
}

.slider-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:50px;
    height:50px;
    border:0;
    border-radius:50%;
    background:white;
    color:#07152f;
    font-size:30px;
    cursor:pointer;
    z-index:5;
}

.slider-prev{
    left:18px;
}

.slider-next{
    right:18px;
}

.slider-dots{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    z-index:10;
}

.slider-dot{
    width:10px;
    height:10px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.5);
    cursor:pointer;
}

.slider-dot.active{
    background:#ed111c;
    transform:scale(1.3);
}

/* =====================================================
   CERTIFICATE
===================================================== */

.certificate-box{
    max-width:550px;
    margin:auto;
    background:white;
    padding:12px;
    border-radius:25px;
    box-shadow:0 15px 45px rgba(20,44,80,.12);
    cursor:pointer;
}

.certificate-box img{
    width:100%;
    border-radius:17px;
    display:block;
}

.certificate-text{
    text-align:center;
    padding:18px 10px 10px;
}

.certificate-text h3{
    font-size:23px;
}

.certificate-text p{
    color:#64748b;
    margin-top:7px;
}

/* =====================================================
   CTA
===================================================== */

.cta-section{
    padding:30px 20px 80px;
}

.cta{
    max-width:1150px;
    margin:auto;
    padding:60px 25px;
    border-radius:30px;
    text-align:center;
    background:linear-gradient(135deg,#ed111c,#a80811);
    color:white;
    box-shadow:0 20px 50px rgba(237,17,28,.2);
}

.cta h2{
    font-size:40px;
    margin-bottom:12px;
}

.cta p{
    color:#ffe2e3;
    font-size:18px;
    margin-bottom:25px;
}

.cta-button{
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:white;
    color:#b40c14;
    padding:16px 28px;
    border-radius:14px;
    font-size:18px;
    font-weight:800;
}

/* =====================================================
   FORM
===================================================== */

.form-section{
    background:#f7f9fd;
}

.form{
    max-width:650px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:25px;
    box-shadow:0 15px 45px rgba(20,44,80,.09);
}

.form input,
.form textarea{
    width:100%;
    padding:16px;
    margin-bottom:15px;
    border:1px solid #d6ddea;
    border-radius:13px;
    font-size:16px;
    outline:none;
    font-family:inherit;
}

.form input:focus,
.form textarea:focus{
    border-color:#ed111c;
}

.form textarea{
    min-height:130px;
    resize:vertical;
}

.form button{
    width:100%;
    padding:17px;
    border:0;
    border-radius:13px;
    background:#ed111c;
    color:white;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}

.form button:disabled{
    opacity:.7;
    cursor:wait;
}

/* =====================================================
   CONTACTS
===================================================== */

.contacts{
    background:#061431;
    color:white;
}

.contacts-grid{
    max-width:1050px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.contact-card{
    background:#102244;
    border:1px solid #263b61;
    border-radius:22px;
    padding:30px 20px;
    text-align:center;
    color:white;
    transition:.25s;
}

.contact-card:hover{
    transform:translateY(-5px);
}

.contact-icon{
    font-size:40px;
    margin-bottom:13px;
}

.contact-card h3{
    font-size:20px;
    margin-bottom:7px;
}

.contact-card p{
    color:#cbd5e1;
}

/* =====================================================
   MODAL
===================================================== */

.image-modal{
    position:fixed;
    inset:0;
    z-index:5000;
    background:rgba(0,0,0,.95);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.image-modal.active{
    display:flex;
}

.image-modal img{
    max-width:95%;
    max-height:90vh;
    object-fit:contain;
    border-radius:15px;
}

.close-modal{
    position:absolute;
    top:12px;
    right:25px;
    color:white;
    font-size:50px;
    cursor:pointer;
}

/* =====================================================
   FLOATING CONTACT
===================================================== */

.floating-contact{
    position:fixed;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    width:min(520px,calc(100% - 20px));
    display:flex;
    gap:7px;
    padding:8px;
    background:rgba(3,13,35,.95);
    border:1px solid rgba(255,255,255,.13);
    border-radius:18px;
    z-index:2000;
    box-shadow:0 12px 40px rgba(0,0,0,.3);
    backdrop-filter:blur(12px);
}

.floating-contact a{
    flex:1;
    color:white;
    text-align:center;
    padding:12px 6px;
    border-radius:12px;
    font-size:12px;
    font-weight:800;
}

.float-call{
    background:#16a34a;
}

.float-telegram{
    background:#168fd2;
}

.float-instagram{
    background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
}

/* =====================================================
   FOOTER
===================================================== */

footer{
    background:#020817;
    color:white;
    text-align:center;
    padding:45px 20px 110px;
}

footer strong{
    font-size:24px;
}

footer p{
    color:#8fa0ba;
    margin-top:9px;
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:900px){

    .header-inner{
        min-height:75px;
        padding:10px 15px;
    }

    .logo-icon{
        width:48px;
        height:48px;
        font-size:27px;
    }

    .logo-text h1{
        font-size:21px;
    }

    .logo-text p{
        font-size:12px;
    }

    .header-buttons .telegram-button,
    .header-buttons .request-button{
        display:none;
    }

    .hero-container{
        grid-template-columns:1fr;
        text-align:center;
        padding-top:55px;
    }

    .hero{
        min-height:auto;
    }

    .hero-container{
        min-height:auto;
    }

    .hero-subtitle{
        margin-left:auto;
        margin-right:auto;
    }

    .hero-list{
        display:inline-block;
        text-align:left;
    }

    .hero-visual{
        min-height:430px;
        margin-top:15px;
    }

    .services-grid{
        grid-template-columns:1fr;
    }

    .why-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .contacts-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:550px){

    .hero h2{
        font-size:44px;
    }

    .hero-subtitle{
        font-size:16px;
    }

    .hero-list li{
        font-size:16px;
    }

    .hero-list-icon{
        width:40px;
        height:40px;
    }

    .hero-visual{
        min-height:330px;
    }

    .camera{
        width:150px;
        height:90px;
        right:15%;
        top:35px;
    }

    .camera::before{
        width:55px;
        height:55px;
        top:18px;
    }

    .camera-lens{
        width:43px;
        height:43px;
        top:24px;
    }

    .fire-panel{
        width:210px;
        height:130px;
        right:8%;
        bottom:55px;
        padding:12px;
    }

    .fire-panel-screen{
        height:48px;
        font-size:9px;
    }

    .fire-panel-title{
        font-size:14px;
        margin-top:7px;
    }

    .fire-alarm{
        width:75px;
        height:75px;
        right:-5px;
        bottom:25px;
        font-size:11px;
    }

    .fire-alarm span{
        font-size:22px;
    }

    .smoke{
        width:65px;
        height:65px;
        left:8%;
        bottom:40px;
    }

    .section{
        padding:55px 15px;
    }

    .section-title h2{
        font-size:31px;
    }

    .why-box{
        padding:40px 20px;
    }

    .why-title h2{
        font-size:31px;
    }

    .why-grid{
        grid-template-columns:1fr 1fr;
        gap:25px 10px;
    }

    .why-card h3{
        font-size:15px;
    }

    .why-icon{
        width:58px;
        height:58px;
        font-size:24px;
    }

    .work-slide img{
        height:430px;
    }

    .work-info{
        padding:75px 20px 25px;
    }

    .work-info h3{
        font-size:20px;
    }

    .cta{
        padding:45px 20px;
    }

    .cta h2{
        font-size:30px;
    }

    .form{
        padding:20px;
    }

    .floating-contact{
        bottom:7px;
        width:calc(100% - 14px);
        gap:4px;
